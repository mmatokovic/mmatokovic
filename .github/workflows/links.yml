name: Links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --scheme https --scheme http --accept '200..=299,403,429' 'content/**/*.md'
          fail: false

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken external links
          content-filepath: ./lychee/out.md
          labels: links
