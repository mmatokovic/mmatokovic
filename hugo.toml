baseURL = 'https://misli.mmatokovic.dev/'
locale = 'hr'
title = 'Misli'
defaultContentLanguage = 'hr'
theme = 'sleeve'
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

[services]
  [services.googleAnalytics]
    id = 'G-CV3ZRVVWGW'

[params]
  alpine = true
  turbo = true
  [params.author]
    name = "Mislav Matoković"
    email = 'me@mmatokovic.dev'

[privacy]
  [privacy.youTube]
    privacyEnhanced = true

[[cascade]]
  [cascade.build]
    publishResources = false

[pagination]
  pagerSize = 9

[taxonomies]
  tag = 'tags'
  series = 'series'
  genre = 'genres'

[languages]
  [languages.hr]
    locale = 'hr'
    label = 'Hrvatski'
    contentDir = 'content/hr'
    weight = 1
    [languages.hr.params]
      description = 'Misli je blog Mislava Matokovića o povijesti, prapovijesnoj umjetnosti i znanosti.'
    [languages.hr.menus]
      [[languages.hr.menus.main]]
        name = 'Početna'
        pageRef = '/'
        weight = 10
      [[languages.hr.menus.main]]
        name = 'Članci'
        pageRef = '/posts'
        weight = 20
      [[languages.hr.menus.main]]
        name = 'Kontaktiraj me'
        pageRef = '/contact'
        weight = 40
      [[languages.hr.menus.main]]
        name = 'O meni'
        pageRef = '/about'
        weight = 50
      [[languages.hr.menus.main]]
        name = 'Teme'
        pageRef = '/tags'
        weight = 70
  [languages.en]
    locale = 'en'
    label = 'English'
    contentDir = 'content/en'
    weight = 2
    [languages.en.params]
      description = "Misli is Mislav Matoković's blog about history, prehistoric art and science."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Home'
        pageRef = '/'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Articles'
        pageRef = '/posts'
        weight = 20
      [[languages.en.menus.main]]
        name = 'Contact Me'
        pageRef = '/contact'
        weight = 40
      [[languages.en.menus.main]]
        name = 'About Me'
        pageRef = '/about'
        weight = 50
      [[languages.en.menus.main]]
        name = 'Topics'
        pageRef = '/tags'
        weight = 70

[frontmatter]
  date = ['date', 'publishDate', 'pubdate', 'lastmod', 'modified']
  expiryDate = ['expiryDate', 'unpublishdate']
  lastmod = [':git', 'lastmod', 'modified', 'date', 'publishDate', 'pubdate']
  publishDate = ['publishDate', 'pubdate', 'date']

[module]
  [module.hugoVersion]
    extended = true
    min = "0.168.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source       = "hugo_stats.json"
    target       = "assets/notwatching/hugo_stats.json"
    disableWatch = true
  [[module.mounts]]
    source = "node_modules/alpinejs/dist"
    target = "assets/js/libs/alpinejs"
  [[module.mounts]]
    source = "node_modules/alpine-turbo-drive-adapter/dist"
    target = "assets/js/libs/alpinejs-turbolinks"
  [[module.mounts]]
    source = "node_modules/@hotwired/turbo/dist"
    target = "assets/js/libs/turbo"

[build.buildStats]
  enable = true
[[build.cachebusters]]
  source = "assets/notwatching/hugo_stats\\.json"
  target = "css"
[[build.cachebusters]]
  source = "(postcss|tailwind)\\.config\\.js"
  target = "css"
[[build.cachebusters]]
  source = 'layouts/.*'
  target = 'css'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true

[security.node.permissions]
  allowAddons = ['tailwindcss']
  allowWorker = ['tailwindcss']
[security.exec]
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
