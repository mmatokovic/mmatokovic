baseURL = 'https://misli.mmatokovic.dev/'
locale = 'hr-HR'
title = 'Misli'
titleCaseStyle = 'firstupper'
defaultContentLanguage = 'hr'
theme = 'sleeve'
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

[services]
  [services.googleAnalytics]
    id = 'G-CV3ZRVVWGW'

[params]
  alpine = true
  turbo = true
  favicon = 'favicon.ico'
  [params.license]
    name = 'CC BY 3.0'
    url = 'https://creativecommons.org/licenses/by/3.0/'
  [params.contact]
    provider = 'netlify'
  [params.author]
    name = "Mislav Matoković"
    email = 'me@mmatokovic.dev'

[privacy]
  [privacy.youTube]
    privacyEnhanced = true

[[cascade]]
  [cascade.build]
    publishResources = false

[pagination]
  pagerSize = 9

[taxonomies]
  tag = 'tags'
  series = 'series'

[languages]
  [languages.hr]
    locale = 'hr-HR'
    label = 'Hrvatski'
    contentDir = 'content/hr'
    weight = 1
    [languages.hr.params]
      description = 'Misli je blog Mislava Matokovića o povijesti, prapovijesnoj umjetnosti i znanosti.'
      intro = 'Ja sam Mislav i volim pisati kad imam slobodnog vremena.'
    [languages.hr.menus]
      [[languages.hr.menus.main]]
        name = 'Početna'
        pageRef = '/'
        weight = 10
      [[languages.hr.menus.main]]
        name = 'Članci'
        pageRef = '/posts'
        weight = 20
      [[languages.hr.menus.main]]
        name = 'Kontaktiraj me'
        pageRef = '/contact'
        weight = 40
      [[languages.hr.menus.main]]
        name = 'O meni'
        pageRef = '/about'
        weight = 50
      [[languages.hr.menus.main]]
        name = 'Teme'
        pageRef = '/tags'
        weight = 70
  [languages.en]
    locale = 'en-US'
    label = 'English'
    contentDir = 'content/en'
    weight = 2
    [languages.en.params]
      description = "Misli is Mislav Matoković's blog about history, prehistoric art and science."
      intro = "I'm Mislav, and I like to write when I have free time."
    [languages.en.menus]
      [[languages.en.menus.main]]
        name = 'Home'
        pageRef = '/'
        weight = 10
      [[languages.en.menus.main]]
        name = 'Articles'
        pageRef = '/posts'
        weight = 20
      [[languages.en.menus.main]]
        name = 'Contact Me'
        pageRef = '/contact'
        weight = 40
      [[languages.en.menus.main]]
        name = 'About Me'
        pageRef = '/about'
        weight = 50
      [[languages.en.menus.main]]
        name = 'Topics'
        pageRef = '/tags'
        weight = 70

[frontmatter]
  date = ['date', 'publishDate', 'pubdate', 'lastmod', 'modified']
  expiryDate = ['expiryDate', 'unpublishdate']
  lastmod = [':git', 'lastmod', 'modified', 'date', 'publishDate', 'pubdate']
  publishDate = ['publishDate', 'pubdate', 'date']

[module]
  [module.hugoVersion]
    min = "0.168.0"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source       = "hugo_stats.json"
    target       = "assets/notwatching/hugo_stats.json"
    disableWatch = true

[build.buildStats]
  enable = true
[[build.cachebusters]]
  source = "assets/notwatching/hugo_stats\\.json"
  target = "css"
[[build.cachebusters]]
  source = 'layouts/.*'
  target = 'css'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true

[security.node.permissions]
  allowAddons = ['tailwindcss']
  allowWorker = ['tailwindcss']
[security.exec]
  allow = ['^git$', '^node$', '^tailwindcss$']
